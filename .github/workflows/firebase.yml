name: Firebase (kurallar + bildirim fonksiyonları)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "firebase.json", "ci/firebase-sa.json.enc", ".github/workflows/firebase.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıklar
        run: cd functions && npm install --omit=dev
      - name: Hizmet hesabı (şifreli dosyadan)
        env:
          PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/firebase-sa.json.enc -out "$RUNNER_TEMP/sa.json" -pass env:PASS
      - name: Gerekli Google API'lerini aç
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          gcloud services enable cloudbilling.googleapis.com eventarc.googleapis.com run.googleapis.com \
            cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com \
            pubsub.googleapis.com fcm.googleapis.com firestore.googleapis.com --project device-streaming-a7c40cfa
          sleep 30
      - name: Yayınla
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,functions --project device-streaming-a7c40cfa --non-interactive --force
