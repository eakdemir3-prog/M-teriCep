name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Sabit debug imza anahtarını yerleştir
        run: cp ci/ci-debug.jks debug.keystore

      - name: Debug APK derle
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-configuration-cache 2>&1 | tee build.log

      - name: Birim testleri
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-configuration-cache 2>&1 | tee test.log

      - name: Hataları özetle
        if: failure()
        run: |
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |error:|FAILED|What went wrong|Exception|expected|but was" "$f" | head -60 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          done

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: MusteriCep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Test raporlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: app/build/reports/tests/
          retention-days: 7
