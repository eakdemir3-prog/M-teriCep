name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Sabit debug imza anahtarını yerleştir
        run: cp ci/debug.keystore debug.keystore

      - name: Birim testleri
        run: gradle :app:testDebugUnitTest --stacktrace --no-configuration-cache

      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace --no-configuration-cache

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: MusteriCep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Test raporlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: app/build/reports/tests/
          retention-days: 7
